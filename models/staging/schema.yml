version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    columns:
      - name: payment_id
        tests:
          - unique
          - not_null
      - name: payment_method
        tests:
          - accepted_values:
              values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']

  - name: stg_dex
    columns:
      - name: blockchain
        tests: 
          - accepted_values:
              values: ['bnb', 'fantom']
      - name: project
        tests:
          - accepted_values:
              values: ['ellipsis_finance', 'curve']
      - name: token_type
        tests:
          - accepted_values:
              values: ['underlying_token_bought', 'pool_token', 'underlying_token_sold']
            
